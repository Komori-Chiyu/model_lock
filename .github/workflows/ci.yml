name: ModelLock CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install cryptography
      - name: Unit tests (packager + server)
        run: python3 -m unittest packager.tests.test_vkit server.tests.test_server -v
      - name: End-to-end test
        run: python3 tests/e2e.py

  windows-client:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Dokan dev SDK
        shell: pwsh
        run: |
          $url = 'https://github.com/dokan-dev/dokan-dokany/releases/download/v2.2.1/Dokan_x64_devsetup.exe'
          $out = Join-Path $env:TEMP 'Dokan_x64_devsetup.exe'
          Invoke-WebRequest -Uri $url -OutFile $out
          Start-Process -Wait -FilePath $out -ArgumentList '/S'
        continue-on-error: true
      - name: Cargo check
        shell: pwsh
        run: |
          cargo check --locked 2>&1 | Tee-Object -FilePath check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cargo build (release)
        shell: pwsh
        continue-on-error: true
        run: |
          cargo build --release --locked 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelock-client-windows-x64
          path: client/target/release/modelock-client.exe
        continue-on-error: true
      - name: Report Windows build errors
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Windows client build failed:\n';
            for (const f of ['client/check.log', 'client/build.log']) {
              try {
                const log = fs.readFileSync(f, 'utf8');
                body += '### ' + f + '\n```\n' + log.slice(-16000) + '\n```\n';
              } catch (e) {}
            }
            if (body !== 'Windows client build failed:\n') {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body
              });
            }
