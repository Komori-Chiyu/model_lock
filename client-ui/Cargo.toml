[package]
name = "modelock-client-ui"
version = "0.1.0"
edition = "2021"
description = "ModelLock buyer desktop UI"

[[bin]]
name = "modelock-client-ui"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
rfd = "0.15"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
image = "0.25"

[target.'cfg(windows)'.dependencies]
modelock-client = { path = "../client" }
winapi = { version = "0.3", features = ["winbase", "synchapi", "winuser", "winerror", "errhandlingapi", "minwindef", "winnt"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.31", features = ["snapshot"] }

[profile.release]
lto = true
strip = true
